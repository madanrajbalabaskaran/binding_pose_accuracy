# boltz_pose_restraint smoke-test config
# Protein: sperm whale myoglobin (chain 1.A) — kept for continuity with prior
# HEM-based baseline runs, but ligand swapped to a drug-like SMILES so the
# torsion-prior restraint has actual rotatable bonds to act on.
# Ligand: ibuprofen (test compound only — not a real binder for myoglobin,
# this run is purely to validate the pose-restraint code path fires and
# produces sane energies, not to evaluate binding pose accuracy).
sequences:
  - protein:
      id: A
      sequence: "MVLSEGEWQLVLHVWAKVEADVAGHGQDILIRLFKSHPETLEKFDRVKHLKTEAEMKASEDLKKHGVTVLTALGAILKKKGHHEAELKPLAQSHATKHKIPIKYLEFISEAIIHVLHSRHPGNFGADAQGAMNKALELFRKDIAAKYKELGYQG"
      msa: empty 
  - ligand:
      id: B
      smiles: "CC(C)Cc1ccc(cc1)C(C)C(=O)O"
      chiral_restraints: true
      pose_restraints: true
      pose_w_torsion: 1.0
restraints_config:
  angle:
    weight: 1
  bond:
    weight: 1
  chiral:
    weight: 1
  pose:
    w_torsion: 1.0
  start_sigma: 1.0
  gpu: false
  verbose: true
